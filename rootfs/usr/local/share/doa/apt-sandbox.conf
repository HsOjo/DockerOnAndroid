# DockerOnAndroid: apt's DropPrivs does setgid(nogroup)+setgroups(1,&gid),
# leaving _apt without the aid_inet gid this kernel demands for sockets, so
# every apt method fails DNS/connect with EPERM. crun-nomq bind-mounts this
# file into containers whose rootfs ships apt, keeping fetch methods root.
APT::Sandbox::User "root";
