# DockerOnAndroid: raise the default TCP send buffer.
#
# pasta's fallback (non-splice) path advertises the host socket's SO_SNDBUF
# as the receive window toward the guest. With the 16K default found on 3.x
# kernels every guest burst ends in a partial sendmsg(); the unsent tail is
# dropped and recovery depends on the guest's retransmission, which on old
# kernels (no SACK toward pasta, 200ms minimum RTO) collapses into
# exponential backoff - published ports crawl at KB/s.
#
# A 1M default keeps the advertised window (0.75 x buffer) below the actual
# buffer, so partial sends don't happen. wmem_max is raised accordingly so
# autotuning keeps headroom.
net.ipv4.tcp_wmem = 4096 1048576 8388608
net.core.wmem_max = 8388608
